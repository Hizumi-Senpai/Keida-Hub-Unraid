name: Sync Current Release Candidate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-current-beta.yml"
      - ".github/scripts/sync_beta_readme.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-current-release-candidate
  cancel-in-progress: true

jobs:
  sync:
    name: Sync published RC to public distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RC_IMAGE: ghcr.io/hizumi-senpai/keida-hub:rc

    steps:
      - name: Check out install repository
        uses: actions/checkout@v6

      - name: Pull published RC image
        run: docker pull "$RC_IMAGE"

      - name: Read RC version from image
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW_VERSION="$(
            docker run --rm \
              --entrypoint python \
              "$RC_IMAGE" \
              -c "import tomllib; print(tomllib.load(open('/app/backend/pyproject.toml', 'rb'))['project']['version'])"
          )"

          if [[ "$RAW_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-rc.${BASH_REMATCH[2]}"
          elif [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            VERSION="$RAW_VERSION"
          else
            echo "ERROR: Unexpected RC version from image: $RAW_VERSION" >&2
            exit 1
          fi

          echo "Image package version: $RAW_VERSION"
          echo "Published RC:         $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Confirm template follows RC tag
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq \
            '<Repository>ghcr.io/hizumi-senpai/keida-hub:rc</Repository>' \
            templates/keida-hub.xml

      - name: Sync README version marker
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 .github/scripts/sync_beta_readme.py "$VERSION"

      - name: Commit page update when needed
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --check

          if git diff --quiet -- README.md; then
            echo "README is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Sync Unraid page to ${VERSION}"
          git push origin HEAD:main

      - name: Publish public GitHub release entry when needed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Public release already exists: $TAG"
            exit 0
          fi

          NOTES="${RUNNER_TEMP}/keida-public-release.md"
          cat > "$NOTES" <<EOF
          ## Keida Hub ${VERSION}

          This is the public distribution marker for the current supported Keida Hub release candidate.

          - Unraid/current RC image: \`ghcr.io/hizumi-senpai/keida-hub:rc\`
          - Exact version image: \`ghcr.io/hizumi-senpai/keida-hub:${VERSION}\`
          - Existing Beta.9 installs may continue using the maintained \`:beta\` compatibility alias during the RC transition.
          - Normal Unraid Docker updates preserve configuration and appdata under \`/mnt/user/appdata/keida-hub\`.

          This is a **release candidate**, not the final stable \`1.0.0\` channel. The application source repository is separate; this public repository contains the supported Unraid install/update metadata.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Keida Hub ${VERSION}" \
            --notes-file "$NOTES" \
            --prerelease
