name: Publish exact Keida icon 64

on:
  push:
    branches:
      - fix/exact-icon-publish-64
    paths:
      - .github/workflows/publish-keida-icon64.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact PNG
        shell: bash
        run: |
          set -Eeuo pipefail
          cat assets/icon-transfer64/part-*.txt | tr -d '\r\n ' | base64 -d > assets/keida-hairpin-icon.png
          test "$(wc -c < assets/keida-hairpin-icon.png | tr -d ' ')" = "4637"
          echo "af5c361e8df1ff6e42ed3a14ae19371fb0d01498e56f653be44c9700d084a976  assets/keida-hairpin-icon.png" | sha256sum -c -
          file assets/keida-hairpin-icon.png

      - name: Commit only verified binary
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf assets/icon-transfer64
          rm -f .github/workflows/publish-keida-icon64.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/keida-hairpin-icon.png assets/icon-transfer64 .github/workflows/publish-keida-icon64.yml
          git commit -m "Publish exact verified Keida Unraid icon"
          git push origin "HEAD:${GITHUB_REF_NAME}"
